{% extends 'base.html' %} 
{% block title %}Kesehatan & Perawatan Satwa{% endblock %} 
{% block content %}
<div class="container mx-auto p-6">
  <h1 class="text-2xl font-bold mb-6">
    Manajemen Kesehatan dan Perawatan Satwa
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Dokter Hewan Features -->
    <div class="border rounded-lg p-4 bg-blue-50">
      <h2 class="text-xl font-semibold mb-4 text-blue-700">Dokter Hewan</h2>
      <ul class="space-y-2">
        <li>
          <a
            href="{% url 'kesehatan_perawatan_satwa:rekam_medis' %}"
            class="block p-3 bg-blue-100 hover:bg-blue-200 rounded-md"
          >
            Rekam Medis Hewan
          </a>
        </li>
        <li>
          <a
            href="{% url 'kesehatan_perawatan_satwa:jadwal_pemeriksaan' %}"
            class="block p-3 bg-blue-100 hover:bg-blue-200 rounded-md"
          >
            Jadwal Pemeriksaan Kesehatan
          </a>
        </li>
      </ul>
    </div>

    <!-- Penjaga Hewan Features -->
    <div class="border rounded-lg p-4 bg-green-50">
      <h2 class="text-xl font-semibold mb-4 text-green-700">Penjaga Hewan</h2>
      <ul class="space-y-2">
        <li>
          <a
            href="{% url 'kesehatan_perawatan_satwa:pemberian_pakan' %}"
            class="block p-3 bg-green-100 hover:bg-green-200 rounded-md"
          >
            Pemberian Pakan
          </a>
        </li>
        <li>
          <a
            href="{% url 'kesehatan_perawatan_satwa:riwayat_pakan' %}"
            class="block p-3 bg-green-100 hover:bg-green-200 rounded-md"
          >
            Riwayat Pemberian Pakan
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
{% endblock %}
