{% extends 'base.html' %} 
{% block title %}Tambah Jadwal Pemberian Pakan{% endblock %} 
{% block content %}
<div class="container mx-auto p-6">
  <h1 class="text-2xl font-bold mb-6">Form Tambah Pemberian Pakan</h1>

  <div class="border rounded-lg p-6 max-w-xl mx-auto">
    <form method="post" action="">
      {% csrf_token %}

      <div class="mb-4">
        <label for="hewan" class="block mb-2">Pilih Hewan:</label>
        <select
          id="hewan"
          name="hewan"
          class="w-full border p-2 rounded"
          required
        >
          <option value="">-- Pilih Hewan --</option>
          {% for hewan in hewan_data %}
          <option value="{{ hewan.id }}">
            {{ hewan.nama }} ({{ hewan.spesies }})
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-4">
        <label for="jenis_pakan" class="block mb-2">Jenis Pakan:</label>
        <input
          type="text"
          id="jenis_pakan"
          name="jenis_pakan"
          class="w-full border p-2 rounded"
          required
        />
      </div>

      <div class="mb-4">
        <label for="jumlah_pakan" class="block mb-2"
          >Jumlah Pakan (gram):</label
        >
        <input
          type="number"
          id="jumlah_pakan"
          name="jumlah_pakan"
          class="w-full border p-2 rounded"
          required
        />
      </div>

      <div class="mb-4">
        <label for="jadwal" class="block mb-2">Jadwal:</label>
        <input
          type="datetime-local"
          id="jadwal"
          name="jadwal"
          class="w-full border p-2 rounded"
          required
        />
      </div>

      <div class="flex justify-end gap-2">
        <button
          type="submit"
          class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded"
        >
          Simpan
        </button>
        <a
          href="{% url 'kesehatan_perawatan_satwa:pemberian_pakan' %}"
          class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded"
        >
          Batal
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
