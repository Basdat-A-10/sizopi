{% extends 'base.html' %} 
{% block title %}Edit Rekam Medis{% endblock %} 
{% block content %}
<div class="container mx-auto p-6">
  <h1 class="text-2xl font-bold mb-6">Edit Rekam Medis</h1>

  <div class="border rounded-lg p-6 max-w-2xl mx-auto">
    <form method="post" action="">
      {% csrf_token %}

      <div class="mb-4">
        <label for="catatan_tindak_lanjut" class="block mb-2"
          >Catatan Tindak Lanjut:</label
        >
        <textarea
          id="catatan_tindak_lanjut"
          name="catatan_tindak_lanjut"
          class="w-full border p-2 rounded h-20"
        >
{{ rekam_medis.catatan_tindak_lanjut }}</textarea
        >
      </div>

      <div class="mb-4">
        <label for="diagnosis" class="block mb-2">Diagnosis Baru:</label>
        <input
          type="text"
          id="diagnosis"
          name="diagnosis"
          value="{{ rekam_medis.diagnosis }}"
          class="w-full border p-2 rounded"
        />
      </div>

      <div class="mb-4">
        <label for="pengobatan" class="block mb-2">Pengobatan Baru:</label>
        <input
          type="text"
          id="pengobatan"
          name="pengobatan"
          value="{{ rekam_medis.pengobatan }}"
          class="w-full border p-2 rounded"
        />
      </div>

      <div class="flex justify-end gap-2">
        <button
          type="submit"
          class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
        >
          Simpan
        </button>
        <a
          href="{% url 'kesehatan_perawatan_satwa:rekam_medis' %}"
          class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded"
        >
          Batal
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
