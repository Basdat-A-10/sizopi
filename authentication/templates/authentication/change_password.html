{% extends "base.html" %} {% block title %}Ubah Password | Sizopi{% endblock %}
{% block content %}
<style>
  .password-container {
    max-width: 550px;
    margin: 50px auto;
  }

  .password-card {
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    background-color: var(--ghost-white);
    overflow: hidden;
  }

  .password-header {
    background-color: var(--charcoal);
    color: var(--ghost-white);
    padding: 15px;
    text-align: center;
    border-bottom: 3px solid var(--light-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    height: 80px;
  }

  .password-header h1 {
    font-size: 1.5rem;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
  }

  .password-header p {
    margin-top: 3px;
    font-size: 0.85rem;
    opacity: 0.9;
  }

  .password-body {
    padding: 30px;
    background-color: white;
  }

  .form-label {
    font-weight: 500;
    color: var(--charcoal);
    font-size: 0.9rem;
  }

  .form-control {
    border-radius: 6px;
    border: 1px solid #e1e5eb;
    padding: 10px 15px;
    font-size: 0.95rem;
    transition: all 0.2s;
  }

  .form-control:focus {
    box-shadow: 0 0 0 3px rgba(184, 219, 217, 0.25);
    border-color: var(--light-blue);
  }

  .btn-save {
    background-color: var(--charcoal);
    border: none;
    color: white;
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: 500;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .btn-save:hover {
    background-color: #243a43;
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(47, 69, 80, 0.2);
  }

  .btn-cancel {
    background-color: transparent;
    border: 1px solid var(--paynes-gray);
    color: var(--paynes-gray);
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: 500;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .btn-cancel:hover {
    background-color: #f1f3f5;
  }
</style>

<div class="password-container">

  <div class="password-card">
    <div class="password-header">
      <h1><i class="fas fa-lock me-2"></i>UBAH PASSWORD</h1>
      <p>Perbarui password untuk akun Anda</p>
    </div>

    <div class="password-body">
      <form method="POST" action="{% url 'change_password' %}">
        {% csrf_token %}

        <div class="mb-3">
          <label for="old_password" class="form-label">Password Lama</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-key"></i></span>
            <input
              type="password"
              class="form-control"
              id="old_password"
              name="old_password"
              placeholder="Masukkan password lama Anda"
              required
            />
          </div>
        </div>

        <div class="mb-3">
          <label for="new_password" class="form-label">Password Baru</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              class="form-control"
              id="new_password"
              name="new_password"
              placeholder="Masukkan password baru"
              required
            />
          </div>
        </div>

        <div class="mb-4">
          <label for="confirm_password" class="form-label"
            >Konfirmasi Password Baru</label
          >
          <div class="input-group">
            <span class="input-group-text"
              ><i class="fas fa-check-circle"></i
            ></span>
            <input
              type="password"
              class="form-control"
              id="confirm_password"
              name="confirm_password"
              placeholder="Konfirmasi password baru"
              required
            />
          </div>
        </div>

        <div class="d-flex justify-content-between mt-4">
          <a href="{% url 'profile' %}" class="btn btn-cancel">
            <i class="fas fa-arrow-left me-1"></i> KEMBALI
          </a>
          <button type="submit" class="btn btn-save">
            <i class="fas fa-save me-1"></i> SIMPAN
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector("form");
    form.addEventListener("submit", function (e) {
      const newPassword = document.getElementById("new_password").value;
      const confirmPassword = document.getElementById("confirm_password").value;

      if (newPassword !== confirmPassword) {
        e.preventDefault();
        alert("Password baru dan konfirmasi password tidak sama!");
      }
    });
  });
</script>
{% endblock %}
