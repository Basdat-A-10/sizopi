{% extends "base.html" %}

{% block content %}
<style>
    .register-container {
        max-width: 650px;
        margin: 40px auto;
    }
    
    .register-card {
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }
    
    .register-header {
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        color: white;
        padding: 25px 20px;
        text-align: center;
    }
    
    .register-header h1 {
        font-size: 2rem;
        margin: 0;
        font-weight: 600;
    }
    
    .register-body {
        padding: 30px;
    }
    
    .form-control {
        border-radius: 8px;
        padding: 10px 15px;
        font-size: 1rem;
    }
    
    .form-control:focus {
        box-shadow: 0 0 0 3px rgba(56, 239, 125, 0.25);
        border-color: #38ef7d;
    }
    
    .btn-register {
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        border: none;
        color: white;
        padding: 12px 0;
        font-size: 1.1rem;
        font-weight: 500;
        letter-spacing: 1px;
        border-radius: 8px;
        transition: all 0.3s;
        box-shadow: 0 4px 10px rgba(56, 239, 125, 0.2);
    }
    
    .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(56, 239, 125, 0.3);
    }
    
    .login-link {
        text-align: center;
        margin-top: 20px;
    }
    
    .alert {
        border-radius: 8px;
        padding: 15px;
    }
</style>

<div class="register-container">
    
    <div class="register-card">
        <div class="register-header">
            <h1>Daftar Akun</h1>
            <p>Buat akun baru untuk mengakses sistem</p>
        </div>
        
        <div class="register-body">
            <form method="POST" action="{% url 'register' %}">
                {% csrf_token %}
                
                <div class="row mb-3">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label for="nama_depan" class="form-label">Nama Depan</label>
                        <input type="text" class="form-control" id="nama_depan" name="nama_depan" 
                               placeholder="Nama depan" required>
                    </div>
                    <div class="col-md-6">
                        <label for="nama_belakang" class="form-label">Nama Belakang</label>
                        <input type="text" class="form-control" id="nama_belakang" name="nama_belakang" 
                               placeholder="Nama belakang" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="nama_tengah" class="form-label">Nama Tengah (Opsional)</label>
                    <input type="text" class="form-control" id="nama_tengah" name="nama_tengah" 
                           placeholder="Nama tengah (opsional)">
                </div>
                
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" 
                           placeholder="Username" required>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" 
                           placeholder="Email" required>
                </div>
                
                <div class="mb-3">
                    <label for="no_telepon" class="form-label">No. Telepon</label>
                    <input type="tel" class="form-control" id="no_telepon" name="no_telepon" 
                           placeholder="No. telepon" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" 
                           placeholder="Password" required>
                </div>
                
                <div class="mb-4">
                    <label for="password_confirmation" class="form-label">Konfirmasi Password</label>
                    <input type="password" class="form-control" id="password_confirmation" 
                           name="password_confirmation" placeholder="Konfirmasi password" required>
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-register">DAFTAR</button>
                </div>
            </form>
            
            <div class="login-link">
                <p>Sudah punya akun? <a href="{% url 'login' %}">Login di sini</a></p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Auto-dismiss alert after 5 seconds
    setTimeout(function() {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(function(alert) {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        });
    }, 5000);
    
    // Form validation
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const passwordConfirmation = document.getElementById('password_confirmation').value;
        
        if (password !== passwordConfirmation) {
            e.preventDefault();
            alert('Password dan konfirmasi password tidak sama!');
        }
    });
});
</script>
{% endblock %}
